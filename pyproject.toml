[project]
name = "student-project"
version = "0.1.0"
description = "Replication of Lindo et al. (2010) - Academic Probation RDD Analysis"
requires-python = ">=3.11"

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = ["replication/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"main_project.ipynb" = ["E702", "E712", "F401", "F541", "I001"]

[tool.ruff.format]
exclude = ["main_project.ipynb"]

[tool.ruff.lint.isort]
known-first-party = ["auxiliary"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
